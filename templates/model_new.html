{% extends "base.html" %}
{% block title %}Register model — WH40K 10e{% endblock %}
{% block body %}
<p>
  <a href="{{ url_for('lists_index') }}">My Lists</a> ·
  <a href="{{ url_for('list_view', list_id=target_list.id) }}">← {{ target_list.name }}</a>
</p>
<h1>Register a new model in “{{ target_list.name }}”</h1>

<form method="post" enctype="multipart/form-data" class="panel">
  <input type="hidden" name="list_id" value="{{ target_list.id }}">
  <div class="form-grid">
    <div>
      <label>Allegiance</label>
      <select id="allegiance-picker">
        <option value="">-- Choose --</option>
        {% for group in faction_tree %}
          <option value="{{ loop.index0 }}">{{ group.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Faction</label>
      <select id="faction-picker">
        <option value="">-- Choose Allegiance first --</option>
      </select>
    </div>
    <div>
      <label>Search unit</label>
      <input type="text" id="datasheet-search" placeholder="Type unit name…">
    </div>
    <div style="display:flex; align-items:flex-end;">
      <label style="display:flex; align-items:center; gap:0.4rem; padding-bottom:0.4rem; white-space:nowrap;">
        <input type="checkbox" id="show-legends">
        <span>Show Legends</span>
      </label>
    </div>
    <div style="grid-column:1/-1;">
      <label>Pick datasheet *</label>
      <div id="datasheet-area" class="datasheet-picker">
        <div class="empty-state muted">Pick an allegiance/faction or type a unit name above.</div>
      </div>
    </div>

    <div>
      <label>Custom name (optional)</label>
      <input type="text" name="custom_name" placeholder="e.g. Captain Alaric">
    </div>
    <div>
      <label>Paint status</label>
      <select name="status">
        {% for v, label in status_options %}
          <option value="{{ v }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="grid-column:1/-1;">
      <label>Notes</label>
      <textarea name="notes" placeholder="Color scheme, base theme, collection notes…"></textarea>
    </div>
    <div style="grid-column:1/-1;">
      <label>Image (optional)</label>
      <input type="file" name="image" accept="image/*" data-edit-on-upload>
    </div>
  </div>

  <div id="loadout-area" style="margin-top:1rem;"></div>

  <button type="submit">Register</button>
</form>

<script>
(function () {
  const allegianceEl = document.getElementById('allegiance-picker');
  const factionEl = document.getElementById('faction-picker');
  const searchEl  = document.getElementById('datasheet-search');
  const legendsEl = document.getElementById('show-legends');
  const dsAreaEl  = document.getElementById('datasheet-area');
  const loadoutEl = document.getElementById('loadout-area');
  const preselect = {{ preselect_ds | tojson }};
  const factionTree = {{ faction_tree | tojson }};
  let debounceTimer = null;
  let selectedDsId = "";

  // Repopulate faction-picker from the picked allegiance group. Builds
  // <optgroup>s for any named subgroup (e.g. Adeptus Astartes) and a flat
  // list for the rest. Selected catalogue_id stays on factionEl so the
  // downstream datasheet loader keeps using factionEl.value as before.
  function rebuildFactionOptions() {
    const idx = allegianceEl.value;
    if (idx === "") {
      factionEl.innerHTML = '<option value="">-- Choose Allegiance first --</option>';
      factionEl.dispatchEvent(new Event('change'));
      return;
    }
    const group = factionTree[parseInt(idx, 10)];
    if (!group) return;
    let html = '<option value="">-- Choose faction --</option>';
    for (const sub of group.subgroups) {
      if (sub.label) {
        html += '<optgroup label="' + escapeHtml(sub.label) + '">';
        for (const it of sub.items) {
          html += '<option value="' + escapeHtml(it.id) + '">' + escapeHtml(it.name) + '</option>';
        }
        html += '</optgroup>';
      } else {
        for (const it of sub.items) {
          html += '<option value="' + escapeHtml(it.id) + '">' + escapeHtml(it.name) + '</option>';
        }
      }
    }
    factionEl.innerHTML = html;
    factionEl.dispatchEvent(new Event('change'));
  }

  allegianceEl.addEventListener('change', rebuildFactionOptions);

  async function reload() {
    const params = new URLSearchParams();
    if (factionEl.value) params.set('catalogue', factionEl.value);
    if (searchEl.value)  params.set('q', searchEl.value);
    if (legendsEl.checked) params.set('show_legends', '1');
    if (!params.has('catalogue') && !params.has('q') && !preselect) {
      dsAreaEl.innerHTML = '<div class="empty-state muted">Pick an allegiance/faction or type a unit name above.</div>';
      loadoutEl.innerHTML = '';
      selectedDsId = "";
      return;
    }
    const resp = await fetch('/api/datasheets?' + params.toString());
    const data = await resp.json();
    renderTabs(data.tabs);
    if (preselect) {
      selectByValue(preselect);
    }
  }

  function renderTabs(tabs) {
    // Skip tabs with no items so the picker stays compact. Find first
    // non-empty tab to activate.
    const total = tabs.reduce((n, t) => n + t.items.length, 0);
    if (total === 0) {
      dsAreaEl.innerHTML = '<div class="empty-state muted">No matching units.</div>';
      loadoutEl.innerHTML = '';
      selectedDsId = "";
      return;
    }
    const firstKey = (tabs.find(t => t.items.length) || {}).key;
    let html = '<div class="unit-tabs"><div class="tab-headers">';
    for (const t of tabs) {
      const disabled = t.items.length === 0 ? 'disabled' : '';
      const active = t.key === firstKey ? 'active' : '';
      html += `<button type="button" class="tab-header ${active}" data-tab="${t.key}" ${disabled}>${escapeHtml(t.label)} <span class="muted">(${t.items.length})</span></button>`;
    }
    html += '</div>';
    for (const t of tabs) {
      const active = t.key === firstKey ? 'active' : '';
      html += `<div class="tab-panel ${active}" data-tab="${t.key}">`;
      if (t.items.length === 0) {
        html += '<div class="muted" style="padding:0.6rem;">No units in this category.</div>';
      } else {
        html += '<ul class="ds-list">';
        for (const it of t.items) {
          const ptsPart = it.points != null ? ` <span class="muted">(${it.points} pts)</span>` : '';
          html += `<li><label><input type="radio" name="datasheet_id" value="${escapeHtml(it.id)}" required>`
                + ` <b>${escapeHtml(it.name)}</b> <span class="muted" style="font-size:0.8rem;">— ${escapeHtml(it.catalogue_name)}</span>${ptsPart}</label></li>`;
        }
        html += '</ul>';
      }
      html += '</div>';
    }
    html += '</div>';
    dsAreaEl.innerHTML = html;
    bindTabBehaviour();
  }

  function bindTabBehaviour() {
    dsAreaEl.querySelectorAll('.tab-header').forEach(btn => {
      btn.addEventListener('click', function () {
        const k = btn.dataset.tab;
        dsAreaEl.querySelectorAll('.tab-header').forEach(b => b.classList.toggle('active', b.dataset.tab === k));
        dsAreaEl.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === k));
      });
    });
    dsAreaEl.querySelectorAll('input[name="datasheet_id"]').forEach(r => {
      r.addEventListener('change', function () {
        selectedDsId = r.value;
        loadLoadout(r.value);
      });
    });
  }

  function selectByValue(dsId) {
    const r = dsAreaEl.querySelector('input[name="datasheet_id"][value="' + CSS.escape(dsId) + '"]');
    if (r) {
      r.checked = true;
      // Also activate the tab containing this radio so the user can see it.
      const panel = r.closest('.tab-panel');
      if (panel) {
        const key = panel.dataset.tab;
        dsAreaEl.querySelectorAll('.tab-header').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
        dsAreaEl.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === key));
      }
      selectedDsId = dsId;
      loadLoadout(dsId);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadLoadout(dsId) {
    loadoutEl.innerHTML = '';
    if (!dsId) return;
    const resp = await fetch('/api/datasheet/' + dsId + '/loadout');
    const data = await resp.json();
    if (!data.models || data.models.length === 0) return;

    // Wargear/loadout selection deliberately omitted for now — only the
    // per-type count picker is shown. Re-enable by restoring the loadout
    // rendering loop and form fields when wargear UX is ready.
    let html = '<div class="section"><h2>Model types</h2>';
    html += '<div class="card" style="margin-bottom:0.8rem;"><b>Per-type count</b>';
    html += ' <span class="muted" style="font-size:0.85rem;">— defaults to the datasheet\'s minimum composition. Set a count to 0 to skip that type.</span>';
    html += '<div style="margin-top:0.5rem; display:flex; flex-direction:column; gap:0.35rem;">';
    data.models.forEach(m => {
      const dflt = (m.min_count != null) ? m.min_count : 1;
      const max  = (m.max_count != null) ? m.max_count : 99;
      const range = (m.min_count != null && m.max_count != null && m.min_count !== m.max_count)
        ? ` <span class="muted" style="font-size:0.85rem;">(${m.min_count}–${m.max_count})</span>` : '';
      html += `<label style="display:flex; align-items:center; gap:0.5rem;">
        <input type="number" name="count_${escapeHtml(m.id)}" value="${dflt}" min="0" max="${max}" style="width:4.5rem;">
        <span><b>${escapeHtml(m.name)}</b>${range}</span>
      </label>`;
    });
    html += '</div></div></div>';
    loadoutEl.innerHTML = html;
  }

  factionEl.addEventListener('change', reload);
  searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(reload, 250);
  });
  legendsEl.addEventListener('change', reload);
  if (preselect) reload();
})();
</script>
{% endblock %}
